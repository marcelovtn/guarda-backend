name: Snapshot on merge to master

on:
  push:
    branches:
      - master

jobs:
  snapshot:
    name: Checkpoint branch + DB dump + migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set snapshot tag
        id: date
        run: echo "TAG=master-$(date +'%Y-%m-%dT%H-%M')" >> $GITHUB_OUTPUT

      # ── 1. Branch de checkpoint ────────────────────────────────────────────
      - name: Create checkpoint branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b ${{ steps.date.outputs.TAG }}
          git push origin ${{ steps.date.outputs.TAG }}

      # ── 2. Dump do banco ANTES das migrations (backup de segurança) ────────
      - name: Install PostgreSQL client
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          STAMP=$(date +'%Y-%m-%dT%H-%M')
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" \
            --no-owner \
            --no-acl \
            --format=custom \
            --file="dump-${STAMP}.pgdump"

      - name: Upload dump to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          STAMP=$(date +'%Y-%m-%dT%H-%M')
          aws s3 cp "dump-${STAMP}.pgdump" \
            "s3://${R2_BUCKET}/dumps/dump-${STAMP}.pgdump" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
